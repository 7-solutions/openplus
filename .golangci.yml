# golangci-lint config for OpenPlus (T-001).
# Conservative default set: catches real bugs without churn on a stdlib-only codebase.
run:
  timeout: 5m
  go: "1.26"
  # Keep the cgo-free guarantee visible: CGO is off in CI, reflect it here.
  build-tags:

linters:
  disable-all: true
  enable:
    - errcheck        # unchecked errors
    - govet           # go vet
    - ineffassign     # ineffectual assignments
    - staticcheck     # broad correctness
    - unused          # unused code
    - gocritic        # common pitfalls
    - revive          # style + correctness
    - misspell        # typos in comments/strings
    - gofmt           # formatting
    - goimports       # import grouping

linters-settings:
  goimports:
    local-prefixes: github.com/7-solutions/openplus
  staticcheck:
    checks: ["all"]

issues:
  # Don't auto-exclude; surface everything so the Advisor gate sees it.
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
